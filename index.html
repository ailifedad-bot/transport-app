<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>درخواست حمل بار درون‌شهری</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#f4f6f5; --card:#ffffff; --text:#1c2421; --hint:#68746f;
  --line:#d5ddd9; --accent:#1f7a5c; --accent-text:#ffffff; --err:#c0392b;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#141a18; --card:#1d2522; --text:#eef2f0; --hint:#9aa8a2; --line:#33403b; --accent:#3dbd94; --accent-text:#08150f; --err:#ff7b6b;}
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family: Tahoma, "Vazirmatn", "Segoe UI", system-ui, sans-serif;
  background:var(--bg); color:var(--text); line-height:1.7;
  padding:16px 14px calc(24px + env(safe-area-inset-bottom,0px));
}
.wrap{max-width:520px;margin:0 auto}
h1{font-size:20px;margin:4px 0 2px}
.sub{color:var(--hint);font-size:13px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--hint);margin:10px 0 4px}
label:first-child{margin-top:0}
input,select,textarea{
  width:100%;font:inherit;color:var(--text);background:var(--bg);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
textarea{min-height:70px;resize:vertical}
.vehicles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vehicles input{position:absolute;opacity:0;width:0;height:0}
.vehicles label{
  margin:0;text-align:center;padding:14px 8px;border:1px solid var(--line);
  border-radius:12px;background:var(--bg);color:var(--text);font-size:15px;cursor:pointer
}
.vehicles small{display:block;color:var(--hint);font-size:12px}
.vehicles input:checked + label{border-color:var(--accent);outline:2px solid var(--accent);font-weight:bold}
.vehicles input:focus-visible + label{outline:2px solid var(--accent);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{
  width:100%;font:inherit;font-weight:bold;border:0;border-radius:12px;
  padding:14px;background:var(--accent);color:var(--accent-text);cursor:pointer;font-size:16px
}
.msg{font-size:13px;margin:8px 0 0;min-height:20px;color:var(--err)}
.ok{display:none;text-align:center;padding:24px 10px}
.ok.show{display:block}
</style>
</head>
<body>
<div class="wrap">
  <h1>درخواست حمل بار درون‌شهری</h1>
  <p class="sub">وانت و کامیونت. فرم را پر کنید تا همکاران ما تماس بگیرند.</p>

  <form id="f" class="card" novalidate>
    <label>نوع خودرو</label>
    <div class="vehicles">
      <div><input type="radio" name="vehicle" id="v1" value="وانت" checked>
        <label for="v1">وانت<small>بار سبک</small></label></div>
      <div><input type="radio" name="vehicle" id="v2" value="کامیونت">
        <label for="v2">کامیونت<small>بار نیمه‌سنگین</small></label></div>
    </div>

    <label for="from">آدرس مبدأ (محل بارگیری)</label>
    <input id="from" required placeholder="مثلاً: گرگان، خیابان ...">

    <label for="to">آدرس مقصد (محل تخلیه)</label>
    <input id="to" required placeholder="مثلاً: گرگان، بلوار ...">

    <label for="cargo">نوع بار</label>
    <select id="cargo">
      <option>مصالح ساختمانی</option>
      <option>لوله و اتصالات</option>
      <option>لوازم برق ساختمان</option>
      <option>سایر</option>
    </select>

    <div class="row">
      <div>
        <label for="weight">وزن تقریبی (کیلوگرم)</label>
        <input id="weight" type="number" inputmode="numeric" min="0" placeholder="مثلاً 800">
      </div>
      <div>
        <label for="when">زمان بارگیری</label>
        <select id="when">
          <option>هر چه زودتر</option>
          <option>امروز</option>
          <option>فردا</option>
          <option>زمان دیگر (در توضیحات بنویسید)</option>
        </select>
      </div>
    </div>

    <label for="phone">شماره تماس</label>
    <input id="phone" type="tel" inputmode="tel" required placeholder="09xxxxxxxxx">

    <label for="note">توضیحات (اختیاری)</label>
    <textarea id="note" placeholder="مثلاً: نیاز به باربر، طبقه چندم، ..."></textarea>

    <p class="msg" id="msg" role="alert"></p>
    <button type="submit">ارسال درخواست</button>
  </form>

  <div class="card ok" id="ok">
    <h1>درخواست ثبت شد</h1>
    <p class="sub">به زودی با شما تماس می‌گیریم.</p>
  </div>
</div>

<script>
(function(){
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  var f = document.getElementById('f');
  var msg = document.getElementById('msg');

  function toEn(s){
    return String(s||'').replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)})
                        .replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)});
  }
  function val(id){ return document.getElementById(id).value.trim(); }

  f.addEventListener('submit', function(e){
    e.preventDefault();
    msg.textContent = '';
    var phone = toEn(val('phone')).replace(/\s|-/g,'');
    if (!val('from') || !val('to')) { msg.textContent = 'آدرس مبدأ و مقصد را وارد کنید.'; return; }
    if (!/^(\+98|0098|0)?9\d{9}$/.test(phone)) { msg.textContent = 'شماره موبایل را درست وارد کنید (مثلاً 09121234567).'; return; }

    var data = {
      vehicle: (document.querySelector('input[name=vehicle]:checked')||{}).value,
      from: val('from'),
      to: val('to'),
      cargo: val('cargo'),
      weight: toEn(val('weight')),
      when: val('when'),
      phone: phone,
      note: val('note')
    };

    if (tg && tg.initData) {
      tg.sendData(JSON.stringify(data)); // برنامه بعد از ارسال بسته می‌شود
    } else {
      msg.textContent = 'این صفحه باید از داخل تلگرام باز شود.';
    }
  });
})();
</script>
</body>
</html>
